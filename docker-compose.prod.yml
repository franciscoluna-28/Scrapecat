name: scrapecat

services:
  db:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrapecat
      POSTGRES_PASSWORD: scrapecat
      POSTGRES_DB: scrapecat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapecat -d scrapecat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://scrapecat:scrapecat@db:5432/scrapecat
      PORT: "4000"
      HOST: 0.0.0.0
      REPO_ARCHIVE_DIR: /app/repos
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "4000:4000"
    volumes:
      - repo_archives:/app/repos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NEXT_PUBLIC_ALLOW_ADD_REPOS: ${NEXT_PUBLIC_ALLOW_ADD_REPOS:-true}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  repo_archives:
