services:
  db:
    image: pgvector/pgvector:pg17-trixie
    container_name: scrapecat-db
    environment:
      POSTGRES_USER: scrapecat
      POSTGRES_PASSWORD: scrapecat
      POSTGRES_DB: scrapecat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapecat -d scrapecat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scrapecat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: scrapecat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: scrapecat-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio'; sleep 1;
      done;
      mc mb --ignore-existing local/scrapecat-archives;
      echo 'minio bucket ready';
      "

  backend-dev:
    container_name: scrapecat-backend
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/.next
      - repo_archives:/app/repos
    env_file:
      - backend/.env
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgres://scrapecat:scrapecat@db:5432/scrapecat
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - REPO_ARCHIVE_DIR=/app/repos
      # Defaults stay fs/memory (zero infra). Opt into the queue + S3 cache with:
      #   ARCHIVE_STORE=s3 QUEUE_DRIVER=bullmq docker compose up
      - ARCHIVE_STORE=${ARCHIVE_STORE:-fs}
      - QUEUE_DRIVER=${QUEUE_DRIVER:-memory}
      - REDIS_URL=redis://redis:6379
      - S3_BUCKET=scrapecat-archives
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      db:
        condition: service_healthy

  frontend-dev:
    container_name: scrapecat-ui
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend-dev

volumes:
  postgres_data:
  repo_archives:
  redis_data:
  minio_data:
