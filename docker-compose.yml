services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command: ["start", "--log", "info", "--user", "root", "--pass", "root", "rocksdb:/data/fabric.db"]
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data

  backend-dev:
    container_name: fabric-backend
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/.next
    env_file:
      - backend/.env
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=file:./dev.db

  frontend-dev:
    container_name: fabric-ui
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend-dev

volumes:
  surrealdb_data:
